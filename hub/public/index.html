<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfolio de Lexoui</title><meta name="description" content="Les sites et outils créés par Lexoui."><link rel="stylesheet" href="/assets/hub.css"><script defer src="/assets/annonce.js"></script></head>
<body><div class="wrap"><div class="head"><h1>Portfolio de Lexoui</h1></div>
<p style="margin:0 0 22px;opacity:.85">Les outils web que je crée pour des communautés de roleplay.</p>
<div class="grid" id="grid"><p class="vide">Chargement…</p></div>
<div class="foot"><a href="/admin">Admin</a></div></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch('/hub/projets').then(r=>r.json()).then(list=>{
  document.getElementById('grid').innerHTML=list.length?list.map(p=>`<div class="card"><div class="st" style="${p.ferme?'color:#e08a8a':''}">● ${p.ferme?'Fermé temporairement':esc(p.statut)}</div><h2>${esc(p.nom)}</h2><p>${esc(p.description)}</p>
  <div class="tags">${(p.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
  ${p.ferme?'<span class="btn ghost" style="opacity:.6;cursor:default">Fermé</span>':`<a class="btn" href="${esc(p.url)}">Ouvrir</a>`}</div>`).join(''):'<p class="vide">Bientôt des projets ici.</p>';
}).catch(()=>{document.getElementById('grid').innerHTML='<p class="vide">Impossible de charger les projets.</p>'});
</script></body></html>
